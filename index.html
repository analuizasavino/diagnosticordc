/* Layout: identidade Lince. Faixas em azul profundo (abertura e convite) com curvas champagne;
   miolo em marfim com folhas de checklist; rótulos em caixa alta espaçada com filete dourado. */
:root {
  --bg: #F4F1EB;          /* marfim */
  --surface: #FBFAF7;
  --ink: #0C1B33;         /* azul profundo */
  --muted: #5A5E66;       /* grafite */
  --line: #DCD6CB;
  --gold: #B08D57;        /* dourado suave */
  --champagne: #D2BC93;
  --silver: #B9BCC1;      /* cinza */
  --accent: #0C1B33;      /* botão principal */
  --accent-ink: #F4F1EB;
  --accent-soft: #EEE5D4;
  --band: #0C1B33;
  --band-2: #13284A;
  --band-ink: #F4F1EB;
  --band-muted: #A9B2C2;
  --crit: #A8432F;
  --warn: #A77A2C;
  --ok: #3A7457;
  --font-display: "Montserrat", "Segoe UI", system-ui, sans-serif;
  --font-body: "Lato", "Segoe UI", system-ui, -apple-system, sans-serif;
  --font-mono: "Lato", "Segoe UI", system-ui, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #09152A; --surface: #0F2140; --ink: #EFEBE3; --muted: #A9B0BC; --line: #22355A;
    --gold: #C9A86C; --champagne: #D8C29A; --silver: #8E96A3;
    --accent: #D2BC93; --accent-ink: #0C1B33; --accent-soft: #1C3157;
    --band: #0F2140; --band-2: #16305A; --band-ink: #F4F1EB; --band-muted: #A9B2C2;
    --crit: #E08670; --warn: #D9AE5E; --ok: #6BBF92; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #09152A; --surface: #0F2140; --ink: #EFEBE3; --muted: #A9B0BC; --line: #22355A;
  --gold: #C9A86C; --champagne: #D8C29A; --silver: #8E96A3;
  --accent: #D2BC93; --accent-ink: #0C1B33; --accent-soft: #1C3157;
  --band: #0F2140; --band-2: #16305A; --band-ink: #F4F1EB; --band-muted: #A9B2C2;
  --crit: #E08670; --warn: #D9AE5E; --ok: #6BBF92; color-scheme: dark;
}

* { box-sizing: border-box; }
body {
  background: var(--bg); color: var(--ink);
  font-family: var(--font-body); font-size: 17px; line-height: 1.55;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 28px 56px;
}
.wrap { max-width: 700px; margin: 0 auto; display: flex; flex-direction: column; gap: 20px; }
h1, h2, h3 { font-family: var(--font-display); text-wrap: balance; margin: 0; line-height: 1.15; letter-spacing: -.01em; }
p { margin: 0; }
b, strong { font-weight: 700; }
.mono { font-family: var(--font-body); font-size: 11px; text-transform: uppercase; letter-spacing: .22em; }
.eyebrow { font-family: var(--font-display); font-size: 11.5px; font-weight: 500; text-transform: uppercase; letter-spacing: .32em; color: var(--muted); display: flex; flex-direction: column; gap: 10px; }
.eyebrow::after { content: ""; width: 34px; height: 1.5px; background: var(--gold); }
.muted { color: var(--muted); }

.sheet { background: var(--surface); border: 1px solid var(--line); border-radius: 2px; padding: 28px clamp(18px, 5vw, 38px); display: flex; flex-direction: column; gap: 18px; }
.sheet-head { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; flex-wrap: wrap; padding-bottom: 14px; border-bottom: 1px solid var(--line); color: var(--muted); }

.btn { appearance: none; border: 1px solid var(--accent); background: var(--accent); color: var(--accent-ink); font: 600 13px/1 var(--font-display); text-transform: uppercase; letter-spacing: .16em; padding: 17px 24px; border-radius: 2px; cursor: pointer; text-decoration: none; display: inline-flex; align-items: center; justify-content: center; gap: 10px; transition: background .2s, color .2s, border-color .2s; }
.btn:hover { background: var(--gold); border-color: var(--gold); color: #0C1B33; }
.btn.ghost { background: transparent; color: var(--ink); border-color: var(--line); }
.btn.ghost:hover { border-color: var(--gold); color: var(--ink); background: transparent; }
.btn:focus-visible, .opt:focus-visible, .back:focus-visible { outline: 2px solid var(--gold); outline-offset: 3px; }
.row { display: flex; gap: 10px; flex-wrap: wrap; }

/* Faixa azul (abertura e convite) */
.band { position: relative; overflow: hidden; background: var(--band); color: var(--band-ink); border-radius: 2px; padding: 34px clamp(20px, 6vw, 48px) 38px; display: flex; flex-direction: column; gap: 20px; isolation: isolate; }
.band .curves { position: absolute; right: -40px; top: -10px; width: 420px; max-width: 90%; height: 100%; z-index: -1; pointer-events: none; }
.band .eyebrow { color: var(--band-muted); }
.band .logo { color: var(--band-ink); }
.band .muted, .band .small { color: var(--band-muted); }
.band .btn { background: var(--champagne); border-color: var(--champagne); color: #0C1B33; }
.band .btn:hover { background: var(--band-ink); border-color: var(--band-ink); }
.band .btn.ghost { background: transparent; color: var(--band-ink); border-color: color-mix(in srgb, var(--band-ink) 35%, transparent); }
.band .btn.ghost:hover { border-color: var(--champagne); color: var(--champagne); }

.hero h1 { font-size: clamp(30px, 6.4vw, 46px); font-weight: 300; }
.hero h1 em { font-style: normal; font-weight: 600; color: var(--champagne); }
.lede { font-size: 18.5px; color: var(--band-muted); max-width: 54ch; }
.lede b { color: var(--band-ink); font-weight: 700; }
.facts { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); border-top: 1px solid color-mix(in srgb, var(--band-ink) 18%, transparent); }
.fact { padding: 16px 16px 4px 0; display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.fact + .fact { padding-left: 16px; border-left: 1px solid color-mix(in srgb, var(--band-ink) 18%, transparent); }
.fact b { font-family: var(--font-display); font-weight: 500; font-size: 24px; line-height: 1; color: var(--champagne); font-variant-numeric: tabular-nums; }
.fact span { font-size: 14px; color: var(--band-muted); }
@media (max-width: 520px) {
  .facts { grid-template-columns: 1fr; }
  .fact, .fact + .fact { padding: 14px 0; border-left: 0; }
  .fact + .fact { border-top: 1px solid color-mix(in srgb, var(--band-ink) 18%, transparent); }
}
.small { font-size: 14px; color: var(--muted); }
.byline { display: flex; align-items: center; gap: 14px; justify-content: center; text-align: center; }
.byline::before, .byline::after { content: ""; flex: 1; max-width: 60px; height: 1px; background: var(--gold); }

/* Perfil e perguntas */
.q-title { font-size: clamp(21px, 4.3vw, 27px); font-weight: 500; }
.ref { display: flex; flex-wrap: wrap; gap: 6px; }
.tag { font-family: var(--font-body); font-size: 11.5px; font-weight: 700; letter-spacing: .06em; padding: 4px 9px; border-radius: 2px; border: 1px solid var(--champagne); color: var(--ink); background: transparent; }
.hint { font-size: 15px; color: var(--muted); }
.opts { display: flex; flex-direction: column; gap: 10px; }
.opt { appearance: none; text-align: left; width: 100%; background: var(--surface); color: var(--ink); border: 1px solid var(--line); border-radius: 2px; padding: 15px 16px; font: 700 16px/1.35 var(--font-body); cursor: pointer; display: grid; grid-template-columns: 26px 1fr; gap: 14px; align-items: center; transition: border-color .15s, background .15s; }
.opt:hover { border-color: var(--gold); }
.opt .box { width: 24px; height: 24px; border: 1px solid var(--silver); border-radius: 50%; display: grid; place-items: center; font: 600 11px var(--font-display); color: var(--muted); }
.opt small { display: block; font-weight: 400; color: var(--muted); font-size: 14.5px; margin-top: 2px; }
.opt[aria-pressed="true"] { border-color: var(--gold); background: var(--accent-soft); }
.opt[aria-pressed="true"] .box { background: var(--gold); border-color: var(--gold); color: #0C1B33; }

.progress { display: flex; flex-direction: column; gap: 10px; }
.progress-top { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; font-size: 14px; color: var(--muted); }
.progress-top b { color: var(--ink); font: 600 11.5px var(--font-display); text-transform: uppercase; letter-spacing: .24em; }
.track { height: 3px; background: var(--line); border-radius: 0; overflow: hidden; }
.track > i { display: block; height: 100%; background: linear-gradient(90deg, var(--gold), var(--champagne)); width: 0; transition: width .35s ease; }
.nav { display: flex; justify-content: space-between; align-items: center; gap: 12px; }
.back { appearance: none; background: none; border: 0; color: var(--muted); font: 600 12px var(--font-display); text-transform: uppercase; letter-spacing: .18em; cursor: pointer; padding: 6px 0; }
.back:hover { color: var(--ink); }

/* Resultado */
.result-top { display: grid; grid-template-columns: 200px minmax(0, 1fr); gap: 26px; align-items: center; }
@media (max-width: 560px) { .result-top { grid-template-columns: 1fr; justify-items: start; } }
.gauge { width: 200px; max-width: 100%; }
.gauge text { font-family: var(--font-display); fill: var(--ink); }
.verdict { display: flex; flex-direction: column; gap: 12px; min-width: 0; }
.pill { align-self: flex-start; font: 600 11px/1 var(--font-display); text-transform: uppercase; letter-spacing: .2em; padding: 8px 12px; border-radius: 2px; border: 1px solid currentColor; }
.verdict h2 { font-size: clamp(23px, 4.6vw, 30px); font-weight: 500; }

.blocks { display: flex; flex-direction: column; gap: 14px; }
.blk { display: grid; grid-template-columns: minmax(0, 1fr) 52px; gap: 6px 12px; align-items: center; }
.blk-name { font-weight: 700; font-size: 15px; }
.blk-val { font: 500 14px var(--font-display); text-align: right; font-variant-numeric: tabular-nums; }
.blk .track { grid-column: 1 / -1; height: 6px; }
.blk .track > i { transition: width .8s cubic-bezier(.2,.7,.2,1); }

.gaps { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; }
.gap { display: grid; grid-template-columns: 3px minmax(0, 1fr); gap: 16px; padding: 16px 0; border-top: 1px solid var(--line); }
.gap:first-child { border-top: 0; padding-top: 4px; }
.gap h3 { font-family: var(--font-body); font-size: 16.5px; font-weight: 700; line-height: 1.35; margin-bottom: 4px; }
.gap p { font-size: 15px; color: var(--muted); }
.gap .ref { margin-top: 10px; }
.gap .help { margin-top: 10px; font-size: 14px; color: var(--ink); }
.gap .help::before { content: "Como a Lince ajuda · "; font: 600 11px var(--font-display); text-transform: uppercase; letter-spacing: .16em; color: var(--gold); }

.cta h2 { font-size: clamp(24px, 4.8vw, 32px); font-weight: 400; }
.cta h2 em { font-style: normal; font-weight: 600; color: var(--champagne); }
.cta p { color: var(--band-muted); }
.steps { list-style: none; counter-reset: s; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px 22px; }
.steps li { counter-increment: s; display: flex; flex-direction: column; gap: 4px; padding-top: 12px; border-top: 1px solid color-mix(in srgb, var(--band-ink) 18%, transparent); min-width: 0; }
.steps li b { font: 500 15px var(--font-display); color: var(--band-ink); }
.steps li b::before { content: counter(s, decimal-leading-zero) "  "; color: var(--champagne); white-space: pre; }
.steps li span { font-size: 14.5px; color: var(--band-muted); }
@media (max-width: 520px) { .steps { grid-template-columns: 1fr; } }
.contact { font-size: 14px; letter-spacing: .04em; color: var(--band-ink); user-select: all; }
.toast { font-size: 14px; color: var(--champagne); min-height: 1.2em; }
.disclaimer { font-size: 13px; color: var(--muted); text-align: center; max-width: 60ch; margin: 0 auto; }

.screen { animation: in .4s ease both; }
@keyframes in { from { opacity: .001; transform: translateY(6px); } to { opacity: 1; transform: none; } }

/* Curvas da identidade: traços champagne e prata que atravessam a faixa azul. */
const CURVAS = `<svg class="curves" viewBox="0 0 420 400" preserveAspectRatio="xMaxYMid slice" aria-hidden="true">
  <path d="M410 -10 C 250 40, 300 170, 230 240 S 90 330, 60 420" fill="none" stroke="var(--silver)" stroke-opacity=".14" stroke-width="18" stroke-linecap="round"/>
  <path d="M430 30 C 300 70, 330 190, 260 260 S 140 350, 120 430" fill="none" stroke="var(--champagne)" stroke-opacity=".75" stroke-width="2.2"/>
  <path d="M440 120 C 360 150, 380 240, 320 300 S 230 380, 215 440" fill="none" stroke="var(--silver)" stroke-opacity=".35" stroke-width="1.2"/>
</svg>`;

const state = { screen:"intro", step:0, perfil:{}, resp:{}, lista:[] };
const app = document.getElementById("app");

const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;" }[c]));
const diasAte = d => Math.ceil((d - new Date()) / 86400000);

function render() {
  const fn = { intro, perfil, pergunta, resultado }[state.screen];
  app.innerHTML = `<div class="screen" style="display:flex;flex-direction:column;gap:20px">${fn()}</div>`;
  bind();
  window.scrollTo({ top: 0 });
  const first = app.querySelector("[data-focus]");
  if (first) first.focus({ preventScroll: true });
}

function intro() {
  const d = diasAte(PRAZO);
  const prazo = d > 0 ? `<b>${d}</b><span>dias até o fim do prazo de adequação (art. 39)</span>`
                      : `<b>Encerrado</b><span>o prazo de adequação do art. 39 terminou</span>`;
  return `
  <section class="band hero">
    ${CURVAS}
    <span class="logo" role="img" aria-label="Lince Consultoria e Treinamentos"></span>
    <p class="eyebrow">Diagnóstico de prontidão · RDC Anvisa nº 1.039/2026</p>
    <h1>O quanto o seu laboratório está pronto para a <em>RDC 1039</em>?</h1>
    <p class="lede">A nova RDC exige que o Sistema de Gestão da Qualidade siga a <b>ABNT NBR ISO/IEC 17025</b>. Responda 25 itens de checklist e descubra, em porcentagem, onde você está e o que falta.</p>
    <div class="facts">
      <div class="fact">${prazo}</div>
      <div class="fact"><b>Art. 4º, IV</b><span>SGQ conforme a ISO/IEC 17025 passa a ser requisito de funcionamento</span></div>
      <div class="fact"><b>Art. 40</b><span>descumprir a RDC é infração sanitária (Lei nº 6.437/1977)</span></div>
    </div>
    <div class="row"><button class="btn" data-act="start" data-focus>Começar o diagnóstico</button></div>
    <p class="small">Leva cerca de 5 minutos. Suas respostas ficam só no seu navegador.</p>
  </section>
  <p class="small byline">18 anos preparando laboratórios para a ISO/IEC 17025 · 100% de sucesso nos processos de acreditação conduzidos</p>`;
}

function perfil() {
  const p = PERFIL[state.step];
  return `
  ${progresso(`Perfil do laboratório`, state.step + 1, PERFIL.length, 0)}
  <section class="sheet">
    <div class="sheet-head mono"><span>Perfil ${state.step + 1}/${PERFIL.length}</span><span>Define quais itens se aplicam</span></div>
    <h2 class="q-title">${esc(p.q)}</h2>
    <div class="opts">${p.opts.map((o, i) => opt(o, i, state.perfil[p.id] === o.v, "perfil")).join("")}</div>
  </section>
  ${nav()}`;
}

function pergunta() {
  const q = state.lista[state.step];
  const total = state.lista.length;
  const atual = state.resp[q.id];
  const hint = q.id === "licenca" && state.perfil.tipo !== "prestador"
    ? q.hint : (q.id === "licenca" ? "Prestadores de serviço precisam de licença sanitária própria e vigente." : q.hint);
  return `
  ${progresso(BLOCOS[q.b], state.step + 1, total, (state.step) / total)}
  <section class="sheet">
    <div class="sheet-head mono"><span>Item ${String(state.step + 1).padStart(2, "0")}/${total}</span><span>${esc(BLOCOS[q.b])}</span></div>
    <div class="ref">${q.refs.map(r => `<span class="tag">${esc(r)}</span>`).join("")}</div>
    <h2 class="q-title">${esc(q.q)}</h2>
    <p class="hint">${esc(hint)}</p>
    <div class="opts">${OPCOES.map((o, i) => opt(o, i, atual === o.v, "resp")).join("")}</div>
  </section>
  ${nav()}`;
}

function opt(o, i, on, kind) {
  return `<button class="opt" data-${kind}="${esc(o.v)}" aria-pressed="${on}" ${i === 0 ? "data-focus" : ""}>
    <span class="box">${i + 1}</span><span>${esc(o.t)}${o.s ? `<small>${esc(o.s)}</small>` : ""}</span></button>`;
}

function progresso(label, n, total, frac) {
  return `<div class="progress">
    <div class="progress-top"><b>${esc(label)}</b><span class="mono">${n} de ${total}</span></div>
    <div class="track"><i style="width:${Math.round(frac * 100)}%"></i></div></div>`;
}

function nav() {
  return `<div class="nav"><button class="back" data-act="back">← Voltar</button>
    <span class="small">Dica: use as teclas 1 a 4</span></div>`;
}

function calcular() {
  let soma = 0, max = 0;
  const porBloco = {};
  const naoSei = [];
  for (const q of state.lista) {
    const r = state.resp[q.id];
    const v = r > 0 ? r : 0;
    soma += v * q.w; max += 2 * q.w;
    const b = porBloco[q.b] || (porBloco[q.b] = { s:0, m:0 });
    b.s += v * q.w; b.m += 2 * q.w;
    if (r === -1) naoSei.push(q);
  }
  const lacunas = state.lista
    .filter(q => state.resp[q.id] < 2)
    .sort((a, b) => (b.w - a.w) || ((state.resp[a.id] > 0 ? state.resp[a.id] : 0) - (state.resp[b.id] > 0 ? state.resp[b.id] : 0)))
    .slice(0, 3);
  return { pct: Math.round(soma / max * 100), porBloco, lacunas, naoSei };
}

function faixa(p) {
  if (p >= 90) return { cor:"var(--ok)",   rot:"Pronto para auditoria", tit:"Seu laboratório está muito perto do que a RDC 1039 exige.", txt:"O próximo passo é confirmar com uma auditoria independente antes que a fiscalização faça isso por você." };
  if (p >= 70) return { cor:"var(--accent)", rot:"Quase pronto", tit:"A base existe. Faltam ajustes que um fiscal costuma encontrar.", txt:"Feche as lacunas abaixo e registre tudo: na inspeção, o que não está registrado não existe." };
  if (p >= 40) return { cor:"var(--warn)", rot:"Adequação em andamento", tit:"Há um caminho importante pela frente até o fim do prazo.", txt:"Com um plano por etapas dá para chegar a tempo, desde que o trabalho comece agora." };
  return { cor:"var(--crit)", rot:"Longe da adequação", tit:"Hoje o laboratório não atende aos requisitos centrais da RDC 1039.", txt:"Funcionar fora da RDC é infração sanitária. Vale priorizar o sistema de gestão e a auditoria interna já." };
}

function gauge(p, cor) {
  const r = 80, c = Math.PI * r, off = c * (1 - p / 100);
  return `<svg class="gauge" viewBox="0 0 200 120" role="img" aria-label="${p}% de prontidão">
    <path d="M20 100 A80 80 0 0 1 180 100" fill="none" stroke="var(--line)" stroke-width="16" stroke-linecap="butt"/>
    <path id="arc" d="M20 100 A80 80 0 0 1 180 100" fill="none" stroke="${cor}" stroke-width="16"
      stroke-dasharray="${c}" stroke-dashoffset="${c}" data-off="${off}" style="transition:stroke-dashoffset 1s cubic-bezier(.2,.7,.2,1)"/>
    <text x="100" y="96" text-anchor="middle" font-size="46" font-weight="800">${p}%</text>
    <text x="20" y="117" text-anchor="middle" font-size="11" fill="var(--muted)" style="font-family:var(--font-mono)">0</text>
    <text x="180" y="117" text-anchor="middle" font-size="11" fill="var(--muted)" style="font-family:var(--font-mono)">100</text>
  </svg>`;
}

function corDe(p) { return p >= 90 ? "var(--ok)" : p >= 70 ? "var(--accent)" : p >= 40 ? "var(--warn)" : "var(--crit)"; }

function resultado() {
  const r = calcular();
  const f = faixa(r.pct);
  const hoje = new Date().toLocaleDateString("pt-BR");
  const blocos = Object.keys(BLOCOS).filter(k => r.porBloco[k]).map(k => {
    const p = Math.round(r.porBloco[k].s / r.porBloco[k].m * 100);
    return `<div class="blk"><span class="blk-name">${esc(BLOCOS[k])}</span><span class="blk-val">${p}%</span>
      <div class="track"><i data-w="${p}" style="background:${corDe(p)}"></i></div></div>`;
  }).join("");
  const lacunas = r.lacunas.length ? r.lacunas.map(q => {
    const v = state.resp[q.id];
    const cor = v === 1 ? "var(--warn)" : "var(--crit)";
    const st = v === 1 ? "Parcial" : v === -1 ? "Não sabe" : "Não implementado";
    return `<li class="gap"><span class="stripe" style="background:${cor}"></span><div>
      <h3>${esc(st)}: ${esc(q.q)}</h3><p>${esc(q.gap)}</p>
      <div class="ref">${q.refs.map(x => `<span class="tag">${esc(x)}</span>`).join("")}</div>
      <p class="help">${esc(AJUDA[q.id])}</p></div></li>`;
  }).join("") : `<li class="gap"><span class="stripe" style="background:var(--ok)"></span><div><h3>Nenhuma lacuna declarada</h3><p>Todos os itens foram marcados como implementados. Uma auditoria independente confirma se os registros sustentam isso.</p></div></li>`;

  const extra = [];
  if (state.perfil.tipo === "prestador") extra.push("Como prestador de serviços, você também precisa da habilitação na Reblas (art. 5º e 6º), que exige o Relatório de Avaliação do Guia Anvisa nº 25 ou acreditação pelo Inmetro.");
  if (r.naoSei.length) extra.push(`Você marcou “Não sei” em ${r.naoSei.length} ${r.naoSei.length === 1 ? "item" : "itens"}. Eles contaram como não implementados: na inspeção, o que ninguém sabe mostrar conta como ausente.`);

  const contato = [CONFIG.whatsapp && `WhatsApp ${CONFIG.whatsappTxt}`, CONFIG.email, CONFIG.site.replace("https://", "")].filter(Boolean).join(" · ");
  const msg = `Olá! Fiz o diagnóstico de prontidão para a RDC 1039 e meu laboratório ficou em ${r.pct}% (${f.rot}). Quero ajuda para fechar as lacunas.`;
  const ctaHref = CONFIG.whatsapp ? `https://wa.me/${CONFIG.whatsapp}?text=${encodeURIComponent(msg)}`
                : CONFIG.site || "";

  return `
  <section class="sheet">
    <div class="sheet-head mono"><span>Relatório de diagnóstico · ${hoje}</span><span>RDC 1039 × ISO/IEC 17025</span></div>
    <div class="result-top">
      ${gauge(r.pct, f.cor)}
      <div class="verdict">
        <span class="pill" style="color:${f.cor}">${esc(f.rot)}</span>
        <h2>${esc(f.tit)}</h2>
        <p class="muted">${esc(f.txt)}</p>
      </div>
    </div>
  </section>

  <section class="sheet">
    <p class="eyebrow">Prontidão por área</p>
    <div class="blocks">${blocos}</div>
  </section>

  <section class="sheet">
    <p class="eyebrow">${r.lacunas.length ? "As 3 lacunas mais críticas" : "Lacunas"}</p>
    <ul class="gaps">${lacunas}</ul>
    ${extra.map(t => `<p class="hint">${esc(t)}</p>`).join("")}
  </section>

  <section class="band cta">
    ${CURVAS}
    <span class="logo" role="img" aria-label="${esc(CONFIG.nome)}"></span>
    <h2>${r.pct >= 90 ? "Confirme sua prontidão <em>antes da fiscalização</em>" : "Feche essas lacunas <em>antes do fim do prazo</em>"}</h2>
    <p>A Lince prepara laboratórios para a ISO/IEC 17025 há 18 anos, com 100% de sucesso nos processos de acreditação que conduziu. Agora levamos essa experiência para a adequação à RDC 1039, do sistema de gestão à auditoria interna, com um projeto feito para a realidade e a maturidade do seu laboratório.</p>
    <ol class="steps">
      <li><b>Entendimento</b><span>Conhecemos seu laboratório, objetivos e estágio atual.</span></li>
      <li><b>Diagnóstico e planejamento</b><span>Priorizamos as lacunas da RDC e definimos etapas e responsáveis.</span></li>
      <li><b>Implementação e capacitação</b><span>Executamos com sua equipe e a preparamos para a rotina.</span></li>
      <li><b>Acompanhamento</b><span>Monitoramos a evolução até o laboratório estar pronto.</span></li>
    </ol>
    <p class="small">Liderança técnica de Maria Helena Savino, 27 anos em qualidade laboratorial, com projetos para organizações públicas e privadas no Brasil e no exterior.</p>
    <div class="row">
      ${ctaHref ? `<a class="btn" href="${esc(ctaHref)}" target="_blank" rel="noopener">Falar com um especialista</a>` : ""}
      <button class="btn ghost" data-act="share">Copiar meu resultado</button>
    </div>
    <p class="contact">${esc(contato)}</p>
    <p class="toast" id="toast" role="status"></p>
  </section>

  <div class="row" style="justify-content:center"><button class="btn ghost" data-act="restart">Refazer o diagnóstico</button></div>
  <p class="disclaimer">Diagnóstico indicativo, baseado nas respostas informadas. Não substitui auditoria nem a leitura da RDC Anvisa nº 1.039/2026 e da ABNT NBR ISO/IEC 17025:2017.</p>`;
}

function montarLista() {
  state.lista = state.perfil.farma === "sim" ? [...PERGUNTAS, PERGUNTA_TRS] : [...PERGUNTAS];
}

function escolher(kind, val) {
  if (kind === "perfil") {
    state.perfil[PERFIL[state.step].id] = val;
    if (state.step < PERFIL.length - 1) state.step++;
    else { montarLista(); state.screen = "pergunta"; state.step = 0; }
  } else {
    state.resp[state.lista[state.step].id] = Number(val);
    if (state.step < state.lista.length - 1) state.step++;
    else state.screen = "resultado";
  }
  setTimeout(render, 140);
}

function voltar() {
  if (state.screen === "pergunta") {
    if (state.step > 0) state.step--;
    else { state.screen = "perfil"; state.step = PERFIL.length - 1; }
  } else if (state.screen === "perfil") {
    if (state.step > 0) state.step--;
    else state.screen = "intro";
  }
  render();
}

function bind() {
  app.querySelectorAll("[data-perfil]").forEach(b => b.onclick = () => { marcar(b); escolher("perfil", b.dataset.perfil); });
  app.querySelectorAll("[data-resp]").forEach(b => b.onclick = () => { marcar(b); escolher("resp", b.dataset.resp); });
  app.querySelectorAll("[data-act]").forEach(b => b.onclick = () => {
    const a = b.dataset.act;
    if (a === "start") { state.screen = "perfil"; state.step = 0; render(); }
    if (a === "back") voltar();
    if (a === "restart") { state.screen = "intro"; state.step = 0; state.perfil = {}; state.resp = {}; render(); }
    if (a === "share") copiar();
  });
  if (state.screen === "resultado") requestAnimationFrame(() => requestAnimationFrame(() => {
    const arc = document.getElementById("arc");
    if (arc) arc.style.strokeDashoffset = arc.dataset.off;
    app.querySelectorAll(".blk .track > i").forEach(i => i.style.width = i.dataset.w + "%");
  }));
}

function marcar(b) {
  b.parentElement.querySelectorAll(".opt").forEach(o => o.setAttribute("aria-pressed", "false"));
  b.setAttribute("aria-pressed", "true");
}

function copiar() {
  const r = calcular();
  const texto = `Fiz o diagnóstico de prontidão para a RDC Anvisa 1039/2026 e meu laboratório está ${r.pct}% pronto (${faixa(r.pct).rot}). A nova RDC exige SGQ conforme a ISO/IEC 17025. Faça o seu teste também (diagnóstico da Lince Consultoria e Treinamentos).`;
  const t = document.getElementById("toast");
  const ok = () => t.textContent = "Resultado copiado. É só colar no LinkedIn.";
  const falha = () => { t.textContent = texto; const s = getSelection(), rg = document.createRange(); rg.selectNodeContents(t); s.removeAllRanges(); s.addRange(rg); };
  try { navigator.clipboard.writeText(texto).then(ok, falha); } catch (e) { falha(); }
}

document.addEventListener("keydown", e => {
  if (!["perfil", "pergunta"].includes(state.screen)) return;
  const n = Number(e.key);
  const btns = app.querySelectorAll(".opt");
  if (n >= 1 && n <= btns.length) btns[n - 1].click();
  if (e.key === "Backspace" || e.key === "ArrowLeft") voltar();
});

render();
</script>
